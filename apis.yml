name: Rex Inc
description: >-
  Rex Inc, operating as Rex.fit (BabylonAI Inc.), is a Y Combinator (W23) health
  and fitness company building AI-powered, fully automated nutrition tracking.
  Its consumer products include Rex Nutribot, a WhatsApp AI nutrition coach; the
  Drop, a wearable AI camera pendant that detects meals and automatically logs
  calories, protein, carbs, and fats via computer vision; an AI body scanner; and
  personalized coaching with daily health reports. Rex also offers a white-label
  B2B nutrition-and-fitness AI that fitness chains and app builders integrate to
  add meal logging (photo, barcode, or text), recipe and meal-plan generation,
  workout logging, 3D body scans, and nutrition analytics under their own brand.
